name: Daily trust clock

# 20:30 UTC is 02:00 IST. Pages deploys do not schedule this from the Wrangler config.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping trust clock
    runs-on: ubuntu-latest
    steps:
      - name: Run 14-day trust clock
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            https://www.gramsevamitra.com/api/audit/process-trust-clock
