name: Build & Deploy

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CLOUDFLARE_PAGES_PROJECT: gramsevamitra-hub
  CLOUDFLARE_PAGES_BRANCH: main

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Cache Astro and Vite build artifacts
        uses: actions/cache@v4
        with:
          path: |
            apps/hub/node_modules/.astro
            apps/hub/node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-astro-vite-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/**', 'packages/**/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-vite-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-astro-vite-

      - name: Install dependencies
        run: npm ci

      - name: Sync public assets
        run: |
          node scripts/sync-public.mjs
          node scripts/generate-pwa-icons.mjs

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Validate tools registry
        run: npm run validate:tools

      - name: Build hub
        run: npm run build

      - name: Production sanity check
        run: npm run prod-check

      - name: Deploy dry-run validation
        run: npm run deploy:dry-run

      - name: Verify Pages output layout
        run: |
          test -d apps/hub/dist
          test -f apps/hub/dist/_headers
          test -d functions
          grep -q 'camera=(self)' apps/hub/dist/_headers
          echo "Pages output ready:"
          echo "  project=${CLOUDFLARE_PAGES_PROJECT}"
          echo "  branch=${CLOUDFLARE_PAGES_BRANCH}"
          echo "  dist=apps/hub/dist"
          echo "  functions=./functions"
          ls -la apps/hub/dist | head -20

      - name: Upload hub artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-dist
          path: apps/hub/dist
          retention-days: 7

  deploy-hub:
    name: Deploy Hub
    needs: build-and-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gramsevamitra.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download hub artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-dist
          path: apps/hub/dist

      - name: Verify deploy inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it under Settings → Secrets (and production environment if used) with Account:Read + Cloudflare Pages:Edit."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add the Cloudflare account id secret for production deploys."
            exit 1
          fi
          test -f wrangler.toml
          test -d apps/hub/dist
          test -f apps/hub/dist/_headers
          test -d functions
          grep -q 'pages_build_output_dir = "apps/hub/dist"' wrangler.toml
          grep -q 'name = "gramsevamitra-hub"' wrangler.toml
          echo "Deploy inputs verified for ${CLOUDFLARE_PAGES_PROJECT} (${CLOUDFLARE_PAGES_BRANCH})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install wrangler for deploy
        run: npm ci --ignore-scripts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use root wrangler.toml pages_build_output_dir (apps/hub/dist) so Functions at ./functions are included.
          # Do not pass --config: Cloudflare Pages rejects custom Wrangler config paths.
          command: >-
            pages deploy
            --project-name=gramsevamitra-hub
            --branch=main
            --commit-dirty=true
            --commit-hash=${{ github.sha }}
          packageManager: npm
          workingDirectory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
